name: CI and staging deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript, container and health check
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run build

      - name: Build application image
        run: docker build --tag rpi-node-ts-starter:${{ github.sha }} .

      - name: Verify container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d --rm -p 127.0.0.1::3000 rpi-node-ts-starter:${{ github.sha }})
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 3000/tcp | sed 's/.*://')
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health" | grep -qx '{"status":"ok"}'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  deploy-staging:
    name: Deploy tested commit to Pi2 staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 15
    steps:
      - name: Deploy and verify via the Pi2 loopback endpoint
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes pi@pi2.netbird.cloud "bash -s -- '$REVISION'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          app_dir=/srv/devops-staging/rpi-node-ts-starter
          if [ ! -d "$app_dir/.git" ]; then
            git clone --depth 1 https://github.com/zebulon5555/rpi-node-ts-starter.git "$app_dir"
          fi
          cd "$app_dir"
          git fetch --depth 1 origin "$revision"
          git checkout --detach --force "$revision"
          docker compose -p devops-staging -f deploy/compose.staging.yml up -d --build --remove-orphans
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:3010/health | grep -qx '{"status":"ok"}'; then
              docker compose -p devops-staging -f deploy/compose.staging.yml ps
              exit 0
            fi
            sleep 2
          done
          docker compose -p devops-staging -f deploy/compose.staging.yml logs --tail=100
          exit 1
          REMOTE
