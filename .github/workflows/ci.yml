name: CI, registry publish and staging deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: TypeScript, container and health check
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application image
        run: docker build --tag rpi-node-ts-starter:${{ github.sha }} .

      - name: Verify container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d --rm -p 127.0.0.1::3000 rpi-node-ts-starter:${{ github.sha }})
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 3000/tcp | sed 's/.*://')
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health" | grep -qx '{"status":"ok"}'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

  publish-image:
    name: Publish immutable multi-architecture image to GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM image builds
        uses: docker/setup-qemu-action@v3

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zebulon5555/rpi-node-ts-starter:${{ github.sha }}
            ghcr.io/zebulon5555/rpi-node-ts-starter:latest

  deploy-staging:
    name: Deploy immutable image to Pi2 staging
    needs: publish-image
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 15
    steps:
      - name: Deploy and verify via the Pi2 loopback endpoint
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes pi@pi2.netbird.cloud "bash -s -- '$REVISION'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          app_dir=/srv/devops-staging/rpi-node-ts-starter
          if [ ! -d "$app_dir/.git" ]; then
            git clone --depth 1 https://github.com/zebulon5555/rpi-node-ts-starter.git "$app_dir"
          fi
          cd "$app_dir"
          previous_revision=$(git rev-parse HEAD 2>/dev/null || true)
          git fetch --depth 1 origin "$revision"
          git checkout --detach --force "$revision"
          chmod 0755 deploy/staging-deploy.sh
          ./deploy/staging-deploy.sh "ghcr.io/zebulon5555/rpi-node-ts-starter:${revision}" "$previous_revision"
          REMOTE

  notify-telegram:
    name: Notify Telegram about main pipeline result
    needs: [build, publish-image, deploy-staging]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, zbot]
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      BUILD_RESULT: ${{ needs.build.result }}
      PUBLISH_RESULT: ${{ needs.publish-image.result }}
      DEPLOY_RESULT: ${{ needs.deploy-staging.result }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Send deployment status
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BOT_TOKEN" && -n "$CHAT_ID" ]]
          if [[ "$BUILD_RESULT/$PUBLISH_RESULT/$DEPLOY_RESULT" == "success/success/success" ]]; then
            headline="✅ Pi2 staging deploy sikeres"
          else
            headline="❌ Pi2 staging pipeline hiba"
          fi
          message=$(printf '%s\nRepo: %s\nCommit: %s\nBuild: %s | GHCR: %s | Deploy: %s\nRun: %s' "$headline" "$GITHUB_REPOSITORY" "${REVISION:0:12}" "$BUILD_RESULT" "$PUBLISH_RESULT" "$DEPLOY_RESULT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          curl --fail --silent --show-error --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$message"
