services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must identify the immutable GHCR image tag}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3010:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
